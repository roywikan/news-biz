# ============================================================
# CLOUDFLARE WORKERS & PAGES CONFIGURATION
# ============================================================

name = "edge-blog-engine"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages Build Output Directory
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "news-biz-id"
database_id = "1571067b-8c59-4c1e-bc2f-6181aa6e2966"


# Environment Variables
[vars]
SITE_NAME = "News Biz"
SITE_DOMAIN = "news.biz.id"
SITE_URL = "https://news.biz.id"
GITHUB_OWNER = "roywikan"
GITHUB_REPO = "news-biz"
GITHUB_BRANCH = "main"


